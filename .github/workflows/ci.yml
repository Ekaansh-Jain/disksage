name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the real target (APFS clones, Trash, packages); Ubuntu catches
        # anything that accidentally depends on a Mac.
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke test (read-only scan)
        run: |
          disksage --version
          disksage scan --no-ai --min-size 1
